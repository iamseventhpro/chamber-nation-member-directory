name: Release

# Push a tag like v1.0.1 to publish a release with the installable zip.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "7.4"
          tools: none

      - name: Check version numbers match the tag
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          HEADER=$(grep -E '^\s*\*\s*Version:' chamber-nation-member-directory.php | awk '{print $NF}')
          CONSTANT=$(grep -oE "CNMD_VERSION', '[^']+" chamber-nation-member-directory.php | cut -d"'" -f3)
          STABLE=$(grep -E '^Stable tag:' readme.txt | awk '{print $NF}')
          echo "tag=$TAG header=$HEADER constant=$CONSTANT stable=$STABLE"
          test "$TAG" = "$HEADER" && test "$TAG" = "$CONSTANT" && test "$TAG" = "$STABLE"

      - name: Lint PHP (PHP 7.4, the minimum supported version)
        run: find . -name '*.php' -not -path './.git/*' -print0 | xargs -0 -n1 php -l

      - name: Build zip
        run: git archive --format=zip --prefix=chamber-nation-member-directory/ -o chamber-nation-member-directory.zip HEAD

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" chamber-nation-member-directory.zip \
            --title "Chamber Nation Member Directory $GITHUB_REF_NAME" \
            --generate-notes
